name: snake

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#E74400&color_dots=#ebedf0,#ffd2c2,#ff9a73,#ff5931,#e74400
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF5931&color_dots=#161b22,#4a1500,#8a2a00,#d63d00,#ff5931
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
